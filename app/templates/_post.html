<table>
    <tr>
        <td>
            <img src="{{ post.author.avatar(36) }}" />
        </td>
        <td>
            <a href="{{ url_for('user', username=post.author.username) }}">
                {{ post.author.username }}
            </a> said {{ moment(post.timestamp).fromNow() }}:
            <br />
            {{ post.body }}
        </td>
    </tr>
    <script>
        console.log(JSON.stringify(post.author))
    </script>
</table>
